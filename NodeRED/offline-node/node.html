<script type="text/html" data-help-name="cargadero-offline"><p>Las nuevas cargas envían inicio y fin reales de bomba, sin litros ni caudal. La conversión se configura desde la app. El caudal anterior solo se conserva por compatibilidad. Registra primero en SQLite y reenvía hasta recibir confirmación por UUID y revisión. Las fotos se guardan en disco. No acciona relés. El padrón se conserva 72 h como referencia vigente; accesos recibidos fuera de ese plazo también se registran, con marca de revisión. No hay borrado automático de cargas ni fotos. Una sola instancia por estación/carpeta. Node.js 22 o posterior.</p></script>
