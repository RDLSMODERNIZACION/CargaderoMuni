name: Run one-time photo cleanup

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/run-photo-cleanup-once.yml"
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Render and clean old photos
        shell: bash
        run: |
          set -euo pipefail
          URL="https://cargaderomuni.onrender.com/water/admin/cleanup-old-storage-photos?confirm=keep-162-delete-old"

          for i in $(seq 1 40); do
            echo "Attempt $i..."
            BODY_FILE="$(mktemp)"
            CODE="$(curl -sS -L --max-time 45 -o "$BODY_FILE" -w "%{http_code}" "$URL" || true)"
            BODY="$(cat "$BODY_FILE")"
            rm -f "$BODY_FILE"

            echo "HTTP $CODE"
            echo "$BODY"

            if [ "$CODE" = "200" ] && echo "$BODY" | grep -q '"ok":true'; then
              echo "Cleanup completed."
              exit 0
            fi

            sleep 15
          done

          echo "Cleanup endpoint never completed successfully."
          exit 1
